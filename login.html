<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Artisan Guitars Workshop</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/styles.css">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        if (localStorage.getItem('isRTL') === 'true') document.documentElement.setAttribute('dir', 'rtl');
    </script>
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="text-center" style="margin-bottom: 2.5rem;">
            <a href="index.html" class="brand-logo" style="font-size: 1.8rem;"><i class="ph-fill ph-guitar"></i> Artisan Guitars</a>
            <h2 style="margin-top: 1.5rem; font-family: var(--font-heading); font-weight: 500;">Welcome Back</h2>
            <p style="color: var(--clr-text-sec); font-size: 0.95rem; margin-top: 0.5rem;">Access your signature build dashboard</p>
        </div>

        <form action="dashboard.html">
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 500;">Email Address</label>
                <input type="email" placeholder="name@email.com" required style="width: 100%; padding: 0.8rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--clr-border); background: var(--clr-surface-offset); color: var(--clr-text); outline: none;">
            </div>
            <div class="form-group" style="margin-bottom: 1.5rem;">
                <div class="auth-flex" style="margin-bottom: 0.5rem;">
                    <label style="margin: 0; font-weight: 500;">Password</label>
                    <a href="#" style="color: var(--clr-primary); font-weight: 500;">Forgot?</a>
                </div>
                <input type="password" placeholder="••••••••" required style="width: 100%; padding: 0.8rem 1rem; border-radius: var(--radius-sm); border: 1px solid var(--clr-border); background: var(--clr-surface-offset); color: var(--clr-text); outline: none;">
            </div>
            
            <button type="submit" class="nav-btn-primary" style="width: 100%; padding: 1rem; border: none; cursor: pointer; font-size: 1rem;">Sign In to Workshop</button>
        </form>

        <div class="text-center" style="margin-top: 2rem; font-size: 0.95rem;">
            <span style="color: var(--clr-text-sec);">Don't have a workbench yet?</span>
            <a href="signup.html" style="color: var(--clr-primary); font-weight: 600; margin-left: 0.3rem;">Apply for Account</a>
        </div>
    </div>

    <script src="js/scripts.js"></script>
</body>
</html>
